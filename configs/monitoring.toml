# Ongoing-monitoring thresholds (read by gridcast.monitoring.accuracy).
# Documented here, in version control, so a change of threshold is a reviewed
# commit, not an edit to code.
[accuracy]
# trailing window of scored origins: 28 = four whole weeks, so every weekday
# weighs equally (load differs strongly between weekdays and weekends)
window_origins = 28
# below this the window is reported but not zoned: too few days for a band
min_origins = 14
# uncertainty bands: bootstrap that resamples whole DAYS (origins), because
# the 24 hours of one forecast share one weather situation and one model state
# and fail together; resampling hours would pretend they are independent
n_boot = 10000
seed = 20261120
nominal_coverage = 0.80
# zones, after the Basel traffic-light test for VaR backtesting: green while
# the data are consistent with the nominal level, amber when the evidence
# against it passes the first level, red past the second. Basel's red level
# is 99.99%; with ~28 days a bootstrap cannot resolve such a tail, so 99.9%.
amber_level = 0.95
red_level = 0.999

# Feature and target drift (read by gridcast.monitoring.drift).
[drift]
# the recent window, compared as a whole: four weeks, like the accuracy window
window_days = 28
# the seasonal average for an hour pools that hour of day within +-15 days of
# the same day of the year, over the training years
clim_halfwidth_days = 15
# reference windows count as "same season" if centred within +-45 days of
# the day of the year the recent window is centred on
season_halfwidth_days = 45
# a window or day needs at least this share of its hours to count
min_valid_frac = 0.85
# green while the window's mean anomaly lies inside the central 90% of the
# same-season reference windows. Overlapping daily windows from three years
# hold only ~10 independent windows, so tighter tails cannot be resolved
shift_central = 0.90
# share of window hours outside the seasonal training range (trees predict a
# constant there) above which the support check is amber
support_amber = 0.05

# Data checks on the vintage ledger (vintages.csv).
[data]
# a day's published mean load that moves by more than this between two runs
# counts as revised (provisional under-publication is 20-35%)
rel_tol = 0.05
# final days just past the provisional line / older final days: red below.
# Two neighbouring fortnights differ by a few percent with the season and
# ~10-15% around Christmas; an unrevised provisional stretch is 20-35% low
level_ratio_red = 0.85
# the weather archive lags ~6 days; amber when the newest day with
# temperature is older than this
weather_lag_amber_days = 10

# Retraining: when to build a challenger, and when it may replace the
# champion (read by gridcast.monitoring.retraining).
[retraining]
# SCHEDULE: build when the champion has not seen this many days of final
# data (its cutoff to today's provisional line). The backtest retrained daily,
# so every day past that is a day of staleness the backtest never measured
max_unseen_days = 28
# below this, a refresh would add too little new data to be worth a trial
min_new_days = 7
# PERFORMANCE / CONCEPT DRIFT: a red accuracy or concept-drift zone triggers
# at once; an amber one only after it has held on this many distinct days
# (one amber day is noise at these sample sizes)
persistent_amber_days = 7
# CHAMPION / CHALLENGER: paired comparison on the same origins, both scored
# against the same final actuals. Decide no earlier than min_paired origins.
min_paired = 14
# by max_paired the trial ends: a challenger that was neither shown worse nor
# shown non-inferior is promoted if its mean pinball is not above the champion's
# (a tie goes to the fresher model: the refresh is the expected state)
max_paired = 28
# non-inferiority margin on mean pinball loss, the same 2% the backtest gate
# allows a pull request
margin = 0.02
