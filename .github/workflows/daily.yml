name: Daily shadow forecast

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write  # the promotion PR when a challenger wins its trial
  actions: read  # the run history, for run health on the dashboard

concurrency:
  group: daily-shadow
  cancel-in-progress: false

env:
  LOG_BRANCH: forecast-log

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Which bundle is the champion (configs/serving.toml)
        id: champion
        run: python3 .github/scripts/bundle_ref.py | tee -a "$GITHUB_OUTPUT"
      - name: Download the frozen model (not its data)
        env:
          BUNDLE_TAG: ${{ steps.champion.outputs.tag }}
          BUNDLE_FILE: ${{ steps.champion.outputs.file }}
        run: |
          curl -fsSL -o bundle.tar.gz "https://github.com/${{ github.repository }}/releases/download/${BUNDLE_TAG}/${BUNDLE_FILE}"
          tar -xzf bundle.tar.gz models/
          rm bundle.tar.gz
      - name: Month stamp for the raw-data cache
        id: stamp
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore cached ENTSO-E months
        uses: actions/cache/restore@v4
        with:
          path: data/raw/entsoe
          key: entsoe-raw-${{ steps.stamp.outputs.month }}-${{ github.run_id }}
          restore-keys: |
            entsoe-raw-${{ steps.stamp.outputs.month }}-
      - name: Fetch fresh data and rebuild features
        id: build
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: uv run --frozen python -m gridcast.build
      - name: Save ENTSO-E months for the next run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: data/raw/entsoe
          key: entsoe-raw-${{ steps.stamp.outputs.month }}-${{ github.run_id }}
      - name: Check out the log branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "${LOG_BRANCH}" > /dev/null; then
            git fetch origin "${LOG_BRANCH}"
            git worktree add log FETCH_HEAD
          else
            git worktree add --orphan -b "${LOG_BRANCH}" log
          fi
      - name: Forecast, score, log
        id: daily
        run: uv run --frozen python -m gridcast.serving.daily_log --log-dir log
      - name: Accuracy and zones
        id: accuracy
        if: ${{ !cancelled() && steps.daily.outcome != 'skipped' }}
        run: |
          set +e
          uv run --frozen python -m gridcast.monitoring.accuracy --log-dir log
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 2 ]; then exit 0; fi
          exit "${code}"
      - name: Drift and data checks
        id: drift
        if: ${{ !cancelled() && steps.daily.outcome != 'skipped' }}
        run: |
          set +e
          uv run --frozen python -m gridcast.monitoring.drift --log-dir log
          code=$?
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${code}" -eq 2 ]; then exit 0; fi
          exit "${code}"
      - name: Trial state
        id: trial
        if: ${{ !cancelled() && steps.daily.outcome != 'skipped' }}
        run: uv run --frozen python -m gridcast.monitoring.retraining trial-state --log-dir log --github-output
      - name: Close a promoted trial
        if: ${{ steps.trial.outputs.merged == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.trial.outputs.tag }}
          CUTOFF: ${{ steps.trial.outputs.cutoff }}
        run: |
          uv run --frozen python -m gridcast.monitoring.retraining close --log-dir log --status promoted --reason "promotion PR merged: serving.toml train_cutoff = ${CUTOFF}"
          gh release edit "${TAG}" --prerelease=false --title "Champion ${CUTOFF}"
      - name: Challenger shadow forecast
        id: challenger
        if: ${{ steps.trial.outputs.active == 'true' && steps.trial.outputs.merged != 'true' }}
        env:
          TAG: ${{ steps.trial.outputs.tag }}
          ARTIFACT: ${{ steps.trial.outputs.artifact }}
          CUTOFF: ${{ steps.trial.outputs.cutoff }}
        run: |
          curl -fsSL -o challenger.tar.gz "https://github.com/${{ github.repository }}/releases/download/${TAG}/serving_bundle_${CUTOFF}.tar.gz"
          tar -xzf challenger.tar.gz "models/${ARTIFACT}"
          rm challenger.tar.gz
          set +e
          uv run --frozen python -m gridcast.serving.daily_log --log-dir "log/trials/${TAG}" --artifact-dir "models/${ARTIFACT}"
          code=$?
          if [ "${code}" -gt 1 ]; then exit "${code}"; fi
          exit 0
      - name: Compare champion and challenger
        id: compare
        if: ${{ steps.challenger.outcome == 'success' }}
        env:
          TAG: ${{ steps.trial.outputs.tag }}
        run: uv run --frozen python -m gridcast.monitoring.retraining compare --log-dir log --trial-dir "log/trials/${TAG}" --github-output
      - name: Reject the challenger
        if: ${{ steps.compare.outputs.decision == 'reject' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.trial.outputs.tag }}
          CUTOFF: ${{ steps.trial.outputs.cutoff }}
          REASON: ${{ steps.compare.outputs.reason }}
        run: |
          uv run --frozen python -m gridcast.monitoring.retraining close --log-dir log --status rejected --reason "trial: ${REASON}"
          gh release edit "${TAG}" --title "REJECTED challenger ${CUTOFF}"
      - name: Run history and run health
        if: ${{ !cancelled() && steps.daily.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" > runs.json
          uv run --frozen python -m gridcast.monitoring.runs --json runs.json --log-dir log
          rm runs.json
      - name: Commit and push the log
        if: ${{ !cancelled() && steps.daily.outcome != 'skipped' }}
        run: |
          cd log
          git add -A
          if git diff --cached --quiet; then
            echo "log unchanged"
          else
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            git push origin "HEAD:${LOG_BRANCH}"
          fi
      - name: Open the promotion PR
        if: ${{ !cancelled() && steps.compare.outputs.decision == 'promote' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.trial.outputs.tag }}
          CUTOFF: ${{ steps.trial.outputs.cutoff }}
        run: |
          branch="promote/${TAG}"
          open=$(gh pr list --head "${branch}" --state open --json number --jq length)
          if [ "${open}" != "0" ]; then
            echo "promotion PR for ${TAG} already open: waiting for review"
            exit 0
          fi
          git switch -c "${branch}"
          python3 .github/scripts/bundle_ref.py --set-cutoff "${CUTOFF}" --note "promoted from ${TAG}: paired trial passed, see TRIAL.md on ${LOG_BRANCH}"
          git commit -am "promote ${TAG}: serving.toml train_cutoff = ${CUTOFF}"
          git push --force origin "${branch}"
          gh pr create --base main --head "${branch}" --title "Promote ${TAG} to champion" --body-file log/TRIAL.md
      - name: Escalate a red zone
        if: ${{ !cancelled() && (steps.accuracy.outputs.code == '2' || steps.drift.outputs.code == '2') }}
        env:
          ACCURACY: ${{ steps.accuracy.outputs.code }}
          DRIFT: ${{ steps.drift.outputs.code }}
        run: |
          if [ "${ACCURACY}" = "2" ]; then
            echo "::error title=Accuracy zone red::see ACCURACY.md and zones.csv on the ${LOG_BRANCH} branch"
          fi
          if [ "${DRIFT}" = "2" ]; then
            echo "::error title=Drift or data check red::see DRIFT.md and drift.csv on the ${LOG_BRANCH} branch"
          fi
          exit 1
