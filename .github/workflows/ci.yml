name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check --output-format=github .
      - run: uv run --frozen ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  image:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/aashishs97/gridcast
    steps:
      - uses: actions/checkout@v5
      - name: Which bundle is the champion (configs/serving.toml)
        id: champion
        run: python3 .github/scripts/bundle_ref.py | tee -a "$GITHUB_OUTPUT"
      - name: Download and unpack serving bundle
        env:
          BUNDLE_TAG: ${{ steps.champion.outputs.tag }}
          BUNDLE_FILE: ${{ steps.champion.outputs.file }}
        run: |
          curl -fsSL -o bundle.tar.gz "https://github.com/${{ github.repository }}/releases/download/${BUNDLE_TAG}/${BUNDLE_FILE}"
          tar -xzf bundle.tar.gz
          rm bundle.tar.gz
      - name: Build image
        run: >-
          docker build
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          -t "${IMAGE}:${{ github.sha }}"
          -t "${IMAGE}:latest"
          .
      - name: Smoke test under the host's memory limit
        run: |
          docker run -d --name smoke --memory=512m --memory-swap=512m -p 8000:8000 "${IMAGE}:${{ github.sha }}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health -o health.json; then ok=1; break; fi
            sleep 2
          done
          docker logs --tail 20 smoke
          test "$ok" = 1
          cat health.json
          python3 -c "import json, sys; h = json.load(open('health.json')); sys.exit(0 if h['status'] == 'ok' and h['data_matches_artifact'] else 1)"
          origin=$(python3 -c "import json; print(json.load(open('health.json'))['first_servable'].replace('+00:00', 'Z'))")
          curl -fsS "http://localhost:8000/forecast?origin=${origin}" -o forecast.json
          docker inspect smoke --format 'OOMKilled={{.State.OOMKilled}} Status={{.State.Status}}'
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image
        run: docker push --all-tags "${IMAGE}"
      - name: Tell Render to deploy this exact image
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: >-
          curl -fsS -o /dev/null -w "render deploy hook: HTTP %{http_code}\n"
          -X POST --get
          --data-urlencode "imgURL=${IMAGE}:${{ github.sha }}"
          "${RENDER_DEPLOY_HOOK}"
